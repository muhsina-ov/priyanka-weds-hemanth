<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF6DE"/>
      <stop offset="55%" stop-color="#FBE3A6"/>
      <stop offset="100%" stop-color="#E8A93C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5741B"/>
      <stop offset="50%" stop-color="#E8A93C"/>
      <stop offset="100%" stop-color="#B5741B"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#halo)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#8F1D3A" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>
  <!-- Lotus base -->
  <g fill="#C62B4F" opacity="0.9">
    <ellipse cx="140" cy="315" rx="26" ry="12"/>
    <ellipse cx="170" cy="322" rx="26" ry="12"/>
    <ellipse cx="200" cy="325" rx="26" ry="12"/>
    <ellipse cx="230" cy="322" rx="26" ry="12"/>
    <ellipse cx="260" cy="315" rx="26" ry="12"/>
  </g>
  <ellipse cx="200" cy="308" rx="62" ry="18" fill="#8F1D3A"/>
  <!-- Simplified Ganesha -->
  <g stroke="#7A1E12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#F9C46A">
    <!-- ears -->
    <ellipse cx="118" cy="175" rx="34" ry="44" fill="#F6A94B"/>
    <ellipse cx="282" cy="175" rx="34" ry="44" fill="#F6A94B"/>
    <ellipse cx="118" cy="175" rx="16" ry="24" fill="#F9D48A" stroke-width="3"/>
    <ellipse cx="282" cy="175" rx="16" ry="24" fill="#F9D48A" stroke-width="3"/>
    <!-- head -->
    <ellipse cx="200" cy="170" rx="82" ry="78" fill="#F9C46A"/>
    <!-- crown -->
    <path d="M135 112 L150 60 L175 100 L200 52 L225 100 L250 60 L265 112 Z" fill="#C62B4F" stroke="#8F1D3A" stroke-width="4"/>
    <circle cx="200" cy="70" r="10" fill="url(#gold)" stroke="#8F1D3A" stroke-width="3"/>
    <!-- trunk curving to his right -->
    <path d="M200 180 C 198 220, 175 250, 150 258 C 135 263, 128 252, 138 242 C 146 235, 160 238, 168 232 C 182 221, 188 200, 190 185" fill="none" stroke-width="14"/>
    <!-- tusks -->
    <path d="M175 225 L165 250" stroke="#FFF6DE" stroke-width="8"/>
    <!-- eyes -->
    <ellipse cx="168" cy="165" rx="12" ry="14" fill="#fff" stroke-width="3"/>
    <ellipse cx="232" cy="165" rx="12" ry="14" fill="#fff" stroke-width="3"/>
    <circle cx="169" cy="168" r="5" fill="#2A1408" stroke="none"/>
    <circle cx="233" cy="168" r="5" fill="#2A1408" stroke="none"/>
    <!-- tilak -->
    <path d="M200 120 L200 148" stroke="#C62B4F" stroke-width="6"/>
    <circle cx="200" cy="155" r="7" fill="#C62B4F" stroke="none"/>
    <!-- blessings hands hint -->
    <path d="M140 290 C 160 270, 180 265, 200 268 C 220 265, 240 270, 260 290" fill="none" stroke-width="10"/>
  </g>
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#7A1E12" font-style="italic">Sri Ganeshaya Namah</text>
</svg>
